<div class="min-h-screen grid lg:grid-cols-[45fr_55fr] bg-white dark:bg-slate-900 transition-colors">
  <app-auth-brand-panel />

  <main class="relative flex flex-col px-6 py-8 sm:px-12 lg:px-16">
    <!-- Top bar: compact brand (mobile) + theme toggle -->
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3 lg:invisible">
        <span class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-white dark:bg-slate-800 p-1.5 border border-slate-200 dark:border-slate-700 shadow-soft">
          <img src="logo.png" alt="" class="w-full h-full object-contain" />
        </span>
        <div>
          <p class="text-sm font-semibold text-slate-900 dark:text-slate-100 leading-tight">Congregation Tools</p>
          <p class="text-xs text-slate-500 dark:text-slate-400">Bolaoen Congregation</p>
        </div>
      </div>
      <button type="button" (click)="theme.toggle()"
        class="inline-flex items-center justify-center w-9 h-9 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
        [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
        @if (theme.isDark()) {
          <i class="bi bi-sun text-base"></i>
        } @else {
          <i class="bi bi-moon text-base"></i>
        }
      </button>
    </div>

    <!-- Form -->
    <div class="flex-1 flex items-center justify-center py-10">
      <div class="w-full max-w-sm">
        <div class="mb-8">
          <h1 class="text-2xl font-semibold tracking-tight text-slate-900 dark:text-slate-100">Reset password</h1>
          <p class="mt-1.5 text-sm text-slate-500 dark:text-slate-400">Enter your email and choose a new password</p>
        </div>

        <form (ngSubmit)="onSubmit()" class="space-y-5" novalidate>
          <div>
            <label for="forgot-email" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Email</label>
            <input
              id="forgot-email"
              type="email"
              class="ms-field py-2.5"
              [(ngModel)]="email"
              name="email"
              required
              autocomplete="email"
              placeholder="you@example.com"
            />
          </div>

          <div>
            <label for="forgot-new-password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">New password</label>
            <input
              id="forgot-new-password"
              type="password"
              class="ms-field py-2.5"
              [(ngModel)]="newPassword"
              name="newPassword"
              required
              autocomplete="new-password"
              placeholder="At least 6 characters"
            />
          </div>

          <div>
            <label for="forgot-confirm-password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Confirm new password</label>
            <input
              id="forgot-confirm-password"
              type="password"
              class="ms-field py-2.5"
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              required
              autocomplete="new-password"
              placeholder="Re-enter new password"
            />
          </div>

          <button type="submit" class="ms-btn ms-btn-primary w-full py-3" [disabled]="loading">
            @if (loading) {
              <i class="bi bi-arrow-repeat animate-spin text-base"></i>
              <span>Updating...</span>
            } @else {
              <span>Update password</span>
            }
          </button>
        </form>

        <p class="mt-8 text-center text-sm text-slate-600 dark:text-slate-400">
          <a routerLink="/login" class="inline-flex items-center gap-1.5 font-medium text-primary-600 hover:text-primary-700 dark:text-primary-400 dark:hover:text-primary-300">
            <i class="bi bi-arrow-left text-sm"></i>
            Back to sign in
          </a>
        </p>
      </div>
    </div>
  </main>
</div>
